<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HealthAdmin — Hospital Management System</title>
<meta name="description" content="HealthAdmin is a modern hospital management dashboard for patients, doctors and appointments." />
<link rel="icon" type="image/png" href="images/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/login.css" />
</head>
<body class="auth-body">

  <main class="splash fade-up">
    <img src="images/logo.png" alt="HealthAdmin logo" class="splash-logo" />
    <h1>HealthAdmin</h1>
    <p class="tagline">Running the hospital floor from one clean dashboard.</p>

    <div class="loader-track" role="progressbar" aria-label="Loading HealthAdmin" aria-valuemin="0" aria-valuemax="100">
      <div class="loader-fill" id="loaderFill"></div>
    </div>

    <button class="btn btn-primary btn-block" id="continueBtn">Continue to login</button>
  </main>

  <script src="js/app.js"></script>
  <script>
    // Auto-redirect to login shortly after the loader finishes,
    // but the Continue button always works immediately.
    const redirectTimer = setTimeout(function () {
      window.location.href = "login.html";
    }, 2800);

    document.getElementById("continueBtn").addEventListener("click", function () {
      clearTimeout(redirectTimer);
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
