<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — HealthAdmin</title>
<link rel="icon" type="image/png" href="images/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/login.css" />
</head>
<body class="auth-body">

  <div class="auth-card fade-up">
    <div class="auth-brand">
      <img src="images/logo.png" alt="HealthAdmin logo" />
      <span>HealthAdmin</span>
    </div>

    <h2>Welcome back</h2>
    <p>Sign in to manage patients, doctors and appointments.</p>

    <div class="form-alert" id="formAlert" role="alert">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="formAlertText">Please fill in every field.</span>
    </div>

    <form id="loginForm" novalidate>
      <div class="field" id="emailField">
        <label for="email">Email address</label>
        <input class="input" type="email" id="email" name="email" placeholder="you@hospital.com" autocomplete="username" />
        <div class="error-text">Enter your email address.</div>
      </div>

      <div class="field" id="passwordField">
        <label for="password">Password</label>
        <input class="input" type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" />
        <div class="error-text">Enter your password.</div>
      </div>

      <div class="auth-options">
        <label class="checkbox-row">
          <input type="checkbox" id="rememberMe" />
          Remember me
        </label>
        <button type="button" class="link-btn" id="forgotBtn">Forgot password?</button>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>

    <div class="auth-footer">
      © MUKHTARMIT TECH-HUB VERSION 1.0<br />
      Developer: Mukhtar Ibrahim
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
